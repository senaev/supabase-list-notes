name: Deploy GitHub Pages

on:
    push:
        branches:
            - main
    workflow_dispatch:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            NODE_VERSION: '22'
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Install dependencies
              # --ignore-scripts: skip the "prepare" lifecycle script (installs
              # local git hooks via lefthook), which is meaningless in CI and
              # fails in this environment's hooksPath setup.
              run: npm ci --ignore-scripts

            # One step, the same command the pre-push hook runs, so local and CI cannot
            # drift. concurrently runs all four at once and lets each finish even when
            # another fails, so a red build reports every problem instead of only the first.
            - name: Check formatting, lint, typecheck and test
              run: npm run simple-checks

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Run e2e tests
              env:
                  VITE_SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_TEST_PROJECT_URL }}
                  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_TEST_PUBLISHABLE_KEY }}
              run: npm run test:e2e

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7

            - name: Set Vite base path
              run: echo "VITE_BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

            - name: Build app
              run: npm run build

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  path: ./dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

    notify:
        if: always()
        needs:
            - build
            - deploy
        runs-on: ubuntu-latest
        steps:
            - name: Notify Telegram
              env:
                  BUILD_RESULT: ${{ needs.build.result }}
                  DEPLOY_RESULT: ${{ needs.deploy.result }}
                  TG_NOTIFICATION_BOT_TOKEN: ${{ secrets.TG_NOTIFICATION_BOT_TOKEN }}
                  TG_NOTIFICATION_CHAT_ID: ${{ secrets.TG_NOTIFICATION_CHAT_ID }}
              run: |
                  if [ "$BUILD_RESULT" = "success" ] && { [ "$DEPLOY_RESULT" = "success" ] || [ "$DEPLOY_RESULT" = "skipped" ]; }; then
                    STATUS_ICON="✅"
                    STATUS_TEXT="succeeded"
                  else
                    STATUS_ICON="❌"
                    STATUS_TEXT="failed"
                  fi

                  TEXT="${STATUS_ICON} GitHub Pages deploy ${STATUS_TEXT} for <a href=\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\">${GITHUB_REPOSITORY}</a>"

                  curl -sS -X POST "https://api.telegram.org/bot${TG_NOTIFICATION_BOT_TOKEN}/sendMessage" \
                    --data-urlencode "chat_id=${TG_NOTIFICATION_CHAT_ID}" \
                    --data-urlencode "parse_mode=HTML" \
                    --data-urlencode "disable_web_page_preview=true" \
                    --data-urlencode "text=${TEXT}"
